services:
  - type: web
    name: atlasforge-backend
    runtime: python-3.12
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ATLAS_DB_URL
        value: sqlite+aiosqlite:///data/atlas.db
      - key: ATLAS_HOST
        value: 0.0.0.0
      - key: ATLAS_PORT
        value: 8000
    plan: free
